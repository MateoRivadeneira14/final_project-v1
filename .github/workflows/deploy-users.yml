name: Deploy Users Domain to EC2

on:
  push:
    branches:
      - test-dockerizado

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push user services
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-create-service ./backend/domains/users/user-create-service
          docker push ${{ secrets.DOCKER_USERNAME }}/user-create-service

          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-get-profile-service ./backend/domains/users/user-get-profile-service
          docker push ${{ secrets.DOCKER_USERNAME }}/user-get-profile-service

          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-update-service ./backend/domains/users/user-update-service
          docker push ${{ secrets.DOCKER_USERNAME }}/user-update-service

          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-delete-service ./backend/domains/users/user-delete-service
          docker push ${{ secrets.DOCKER_USERNAME }}/user-delete-service

          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-get-all-service ./backend/domains/users/user-get-all-service
          docker push ${{ secrets.DOCKER_USERNAME }}/user-get-all-service

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy user services to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_USERS_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_USERS_SSH_KEY }}
          script: |
            sudo apt update
            sudo apt install -y docker.io docker-compose
            sudo systemctl enable docker
            sudo systemctl start docker

            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            cd /home/ubuntu/users

            sudo docker-compose down
            sudo docker system prune -af
            sudo docker-compose pull
            sudo docker-compose up -d
